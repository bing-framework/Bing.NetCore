<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bing 文件存储示例</title><link rel="icon" href="data:,">
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#182638;background:#f5f7fa}body{max-width:960px;margin:48px auto;padding:0 24px}h1{font-size:28px;margin-bottom:8px}.hint{color:#586779;line-height:1.7}section{background:white;border:1px solid #dce3ec;border-radius:12px;padding:24px;margin-top:24px}label{display:block;margin:16px 0 8px}button,input,select{font:inherit}button{border:1px solid #a4b4c8;border-radius:6px;padding:9px 16px;background:#fff;cursor:pointer;margin:8px 8px 0 0}button.primary{background:#1457a8;border-color:#1457a8;color:white}button:disabled{opacity:.5;cursor:default}input[type=text]{padding:10px;border:1px solid #a4b4c8;border-radius:6px;width:min(90%,480px)}progress{width:100%;height:22px;margin-top:20px}#status{white-space:pre-wrap;line-height:1.6}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #e6ebf1}td:first-child{overflow-wrap:anywhere}.tag{display:inline-block;background:#e9f1fc;color:#1457a8;border-radius:4px;padding:4px 8px}.error{color:#b22525}@media(max-width:600px){body{margin:24px auto;padding:0 16px}section{padding:16px}table{font-size:13px}button{padding:8px}}
</style></head>
<body><h1>文件存储与附件示例</h1><p class="hint">支持分片上传、暂停、刷新后恢复。刷新或重启服务后，请重新选择同一个文件。<br>这是仅绑定本机地址的开发示例身份。</p><span id="backend" class="tag">读取配置…</span>
<section aria-labelledby="upload-title"><h2 id="upload-title">上传文件</h2>
<label for="token">示例访问令牌</label><input id="token" type="text" value="demo-upload-token" autocomplete="off">
<label for="container">容器</label><select id="container"><option value="attachments">私有附件</option><option value="public">公开文件</option></select>
<label for="file">选择文件</label><input id="file" type="file">
<label for="sessions">我的上传任务</label><select id="sessions"><option value="">新上传</option></select>
<div><button id="discover">从服务端找回任务</button><button id="more-sessions" disabled>更多上传任务</button><button id="new-upload">新建上传</button></div>
<div><button id="start" class="primary">开始 / 恢复上传</button><button id="pause" disabled>暂停</button><button id="refresh">查询会话</button><button id="abort">中止并清除会话</button></div>
<progress id="progress" max="100" value="0" aria-label="已确认上传进度"></progress><p id="status" role="status" aria-live="polite">请选择文件。</p>
</section>
<section aria-labelledby="list-title"><h2 id="list-title">已完成的文件</h2><label for="search-name">文件名筛选</label><input id="search-name" type="text"><button id="list">查询首页</button><button id="next-page" disabled>下一页</button><table><thead><tr><th>文件</th><th>大小</th><th>操作</th></tr></thead><tbody id="files"></tbody></table></section>
<script type="module" src="uploader.js"></script></body></html>
