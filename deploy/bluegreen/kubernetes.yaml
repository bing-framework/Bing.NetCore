---
apiVersion: v1
kind: Service
metadata:
  name: bing-web
spec:
  selector: {app: bing-web, color: blue}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bing-consumer-blue
spec:
  replicas: 1
  selector:
    matchLabels: {app: bing-consumer, color: blue}
  template:
    metadata:
      labels: {app: bing-consumer, color: blue}
    spec:
      terminationGracePeriodSeconds: 300
      containers:
        - name: consumer
          image: example.invalid/bing-admin:blue-replace-me
          env:
            - {name: BING_HOST_ROLE, value: consumer}
            - {name: BING_CAP_CONSUMER_ENABLED, value: "true"}
            - {name: BING_CAP_CONSUMER_GROUP, value: bing-admin}
---
