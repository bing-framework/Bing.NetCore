apiVersion: apps/v1
kind: Deployment
metadata:
  name: bing-web-blue
spec:
  replicas: 2
  selector:
    matchLabels: {app: bing-web, color: blue}
  template:
    metadata:
      labels: {app: bing-web, color: blue}
    spec:
      terminationGracePeriodSeconds: 300
      containers:
        - name: web
          image: example.invalid/bing-admin:blue-replace-me
          env:
            - {name: ASPNETCORE_URLS, value: "http://+:8080"}
            - {name: BING_HOST_ROLE, value: web}
            - {name: BING_CAP_CONSUMER_ENABLED, value: "false"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 24
          lifecycle:
            preStop:
              exec: {command: ["/bin/sh", "-c", "sleep 15"]}
---
