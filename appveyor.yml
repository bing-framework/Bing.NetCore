version: 1.0.0.{build}
image:
  - Visual Studio 2022
pull_requests:
  do_not_increment_build_number: true
branches:
  only:
    - master
skip_branch_with_pr: true
configuration: Release
environment:
  matrix:
    # common 不接触任何外部 Provider secret；其余 lane 必须在 AppVeyor 受保护环境中注入专属变量。
    # release 在同一个受保护 job 内完成 Provider、SQLite、Unit、Analyzer、FormalHost 和 aggregate。
    # aggregate 不是独立 lane，避免依赖 AppVeyor matrix job 之间不存在的共享工作区。
    - PROVIDER_TEST_LANE: common
    - PROVIDER_TEST_LANE: mysql
    - PROVIDER_TEST_LANE: postgresql
    - PROVIDER_TEST_LANE: sqlserver
    - PROVIDER_TEST_LANE: release
before_build:
  - ps: |
      $ErrorActionPreference = 'Stop'
      $dotnetRoot = Join-Path $env:APPVEYOR_BUILD_FOLDER '.ci-dotnet'
      $installer = Join-Path $env:TEMP 'dotnet-install.ps1'
      $globalJson = Join-Path $env:APPVEYOR_BUILD_FOLDER 'global.json'
      Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile $installer

      & $installer -JsonFile $globalJson -InstallDir $dotnetRoot -NoPath
      if (-not $?) { throw 'SDK installation failed.' }
      foreach ($channel in @('6.0', '8.0')) {
        & $installer -Runtime dotnet -Channel $channel -InstallDir $dotnetRoot -SkipNonVersionedFiles -NoPath
        if (-not $?) { throw ".NET runtime installation failed for $channel." }
        & $installer -Runtime aspnetcore -Channel $channel -InstallDir $dotnetRoot -SkipNonVersionedFiles -NoPath
        if (-not $?) { throw "ASP.NET Core runtime installation failed for $channel." }
      }

      $previousPath = $env:PATH
      $env:DOTNET_ROOT = $dotnetRoot
      $env:PATH = "$dotnetRoot;$previousPath"
      Set-AppveyorBuildVariable -Name 'DOTNET_ROOT' -Value $dotnetRoot
      Set-AppveyorBuildVariable -Name 'PATH' -Value $env:PATH

      $resolvedDotnet = (Get-Command dotnet -CommandType Application).Source
      if (-not $resolvedDotnet.StartsWith($dotnetRoot, [StringComparison]::OrdinalIgnoreCase)) {
        throw "The task-local dotnet was not selected: $resolvedDotnet"
      }
      if ((& dotnet --version).Trim() -ne '10.0.400') { throw 'Expected .NET SDK 10.0.400.' }
      $runtimes = & dotnet --list-runtimes
      $sdks = & dotnet --list-sdks
      $sdks
      $sdkPath = Join-Path $dotnetRoot 'sdk'
      if (-not ($sdks | Where-Object { $_.StartsWith('10.0.400 ', [StringComparison]::Ordinal) -and $_.EndsWith("[$sdkPath]", [StringComparison]::OrdinalIgnoreCase) })) {
        throw 'SDK 10.0.400 was not installed under DOTNET_ROOT.'
      }
      $runtimes
      foreach ($runtime in @('Microsoft.NETCore.App 6.0.', 'Microsoft.NETCore.App 8.0.', 'Microsoft.AspNetCore.App 6.0.', 'Microsoft.AspNetCore.App 8.0.')) {
        $runtimeFamily = $runtime.Substring(0, $runtime.LastIndexOf(' '))
        $runtimePath = Join-Path (Join-Path $dotnetRoot 'shared') $runtimeFamily
        if (-not ($runtimes | Where-Object { $_.StartsWith($runtime, [StringComparison]::Ordinal) -and $_.EndsWith("[$runtimePath]", [StringComparison]::OrdinalIgnoreCase) })) {
          throw "Required runtime is missing: $runtime"
        }
      }
build:
  verbosity: minimal
  parallel: true
build_script:
  - ps: |
      $ErrorActionPreference = 'Stop'
      $dotnetRoot = Join-Path $env:APPVEYOR_BUILD_FOLDER '.ci-dotnet'
      if ($env:DOTNET_ROOT -ne $dotnetRoot -or ($env:PATH -split ';')[0] -ne $dotnetRoot) {
        throw 'Task-local DOTNET_ROOT/PATH did not persist from before_build.'
      }
      $resolvedDotnet = (Get-Command dotnet -CommandType Application).Source
      if (-not $resolvedDotnet.StartsWith($dotnetRoot, [StringComparison]::OrdinalIgnoreCase)) {
        throw "The task-local dotnet is not first on PATH: $resolvedDotnet"
      }
      if ((& dotnet --version).Trim() -ne '10.0.400') { throw 'Expected .NET SDK 10.0.400 in build_script.' }
      $sdks = & dotnet --list-sdks
      $sdks
      $sdkPath = Join-Path $dotnetRoot 'sdk'
      if (-not ($sdks | Where-Object { $_.StartsWith('10.0.400 ', [StringComparison]::Ordinal) -and $_.EndsWith("[$sdkPath]", [StringComparison]::OrdinalIgnoreCase) })) {
        throw 'SDK 10.0.400 is not available under DOTNET_ROOT in build_script.'
      }
      $runtimes = & dotnet --list-runtimes
      $runtimes
      foreach ($runtime in @('Microsoft.NETCore.App 6.0.', 'Microsoft.NETCore.App 8.0.', 'Microsoft.AspNetCore.App 6.0.', 'Microsoft.AspNetCore.App 8.0.')) {
        $runtimeFamily = $runtime.Substring(0, $runtime.LastIndexOf(' '))
        $runtimePath = Join-Path (Join-Path $dotnetRoot 'shared') $runtimeFamily
        if (-not ($runtimes | Where-Object { $_.StartsWith($runtime, [StringComparison]::Ordinal) -and $_.EndsWith("[$runtimePath]", [StringComparison]::OrdinalIgnoreCase) })) {
          throw "Required runtime is missing in build_script: $runtime"
        }
      }
      & dotnet restore Bing.All.slnx
      if ($LASTEXITCODE -ne 0) { throw 'Solution restore failed.' }
      & dotnet build Bing.All.slnx -c Release --no-restore
      if ($LASTEXITCODE -ne 0) { throw 'Solution build failed.' }
test_script:
  - ps: |
      $ErrorActionPreference = 'Stop'
      $dotnetRoot = Join-Path $env:APPVEYOR_BUILD_FOLDER '.ci-dotnet'
      if ($env:DOTNET_ROOT -ne $dotnetRoot -or ($env:PATH -split ';')[0] -ne $dotnetRoot) {
        throw 'Task-local DOTNET_ROOT/PATH did not persist through build_script.'
      }
      $resolvedDotnet = (Get-Command dotnet -CommandType Application).Source
      if (-not $resolvedDotnet.StartsWith($dotnetRoot, [StringComparison]::OrdinalIgnoreCase)) {
        throw "The task-local dotnet is not first on PATH: $resolvedDotnet"
      }
      if ((& dotnet --version).Trim() -ne '10.0.400') { throw 'Expected .NET SDK 10.0.400 in test_script.' }
      $sdks = & dotnet --list-sdks
      $sdks
      $sdkPath = Join-Path $dotnetRoot 'sdk'
      if (-not ($sdks | Where-Object { $_.StartsWith('10.0.400 ', [StringComparison]::Ordinal) -and $_.EndsWith("[$sdkPath]", [StringComparison]::OrdinalIgnoreCase) })) {
        throw 'SDK 10.0.400 is not available under DOTNET_ROOT in test_script.'
      }
      $runtimes = & dotnet --list-runtimes
      $runtimes
      foreach ($runtime in @('Microsoft.NETCore.App 6.0.', 'Microsoft.NETCore.App 8.0.', 'Microsoft.AspNetCore.App 6.0.', 'Microsoft.AspNetCore.App 8.0.')) {
        $runtimeFamily = $runtime.Substring(0, $runtime.LastIndexOf(' '))
        $runtimePath = Join-Path (Join-Path $dotnetRoot 'shared') $runtimeFamily
        if (-not ($runtimes | Where-Object { $_.StartsWith($runtime, [StringComparison]::Ordinal) -and $_.EndsWith("[$runtimePath]", [StringComparison]::OrdinalIgnoreCase) })) {
          throw "Required runtime is missing in test_script: $runtime"
        }
      }
      $lane = if ([string]::IsNullOrWhiteSpace($env:PROVIDER_TEST_LANE)) { 'common' } else { $env:PROVIDER_TEST_LANE }
      switch ($lane) {
        'common' {
          # 普通 lane 不继承受保护 Provider 的连接、gate 或 reset 授权。
          'RUN_INTEGRATION_TESTS', 'RUN_MYSQL_INTEGRATION_TESTS', 'RUN_POSTGRESQL_INTEGRATION_TESTS',
          'RUN_SQLSERVER_INTEGRATION_TESTS', 'RUN_ORACLE_INTEGRATION_TESTS', 'RUN_DORIS_INTEGRATION_TESTS',
          'ALLOW_DATABASE_RESET_FOR_TESTS',
          'ConnectionStrings__DefaultConnection', 'ConnectionStrings__MySqlConnection',
          'ConnectionStrings__PostgreSqlConnection', 'ConnectionStrings__SqlServerConnection',
          'ConnectionStrings__OracleConnection', 'ConnectionStrings__DorisConnection' |
            ForEach-Object { Remove-Item "Env:$_" -ErrorAction SilentlyContinue }
          dotnet test Bing.All.slnx -c Release -p:CI=true --logger:"trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"
          if ($LASTEXITCODE -ne 0) { throw 'Common test lane failed.' }
          dotnet run --project .\framework\tests\Bing.Data.Sql.Benchmarks\Bing.Data.Sql.Benchmarks.csproj -c Release --no-build -- --ci-smoke --filter "*SqlCiSmokeBenchmarks*" --artifacts "BenchmarkDotNet.Artifacts\ci"
          if ($LASTEXITCODE -ne 0) { throw 'CI benchmark smoke failed.' }
          dotnet run --project .\framework\tests\Bing.Data.Sql.Benchmarks\Bing.Data.Sql.Benchmarks.csproj -c Release --no-build -- --e2e-smoke --filter "*SqliteDapperE2ESmokeBenchmarks*" --artifacts "BenchmarkDotNet.Artifacts\ci-e2e"
          if ($LASTEXITCODE -ne 0) { throw 'E2E benchmark smoke failed.' }
        }
        'mysql' {
          .\eng\ci\Invoke-ProviderIntegrationTests.ps1 -Provider MySql -Framework net6.0 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'MySQL net6.0 provider lane failed.' }
          .\eng\ci\Invoke-ProviderIntegrationTests.ps1 -Provider MySql -Framework net8.0 -Configuration Release
        }
        'postgresql' {
          .\eng\ci\Invoke-ProviderIntegrationTests.ps1 -Provider PostgreSql -Framework net6.0 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL net6.0 provider lane failed.' }
          .\eng\ci\Invoke-ProviderIntegrationTests.ps1 -Provider PostgreSql -Framework net8.0 -Configuration Release
        }
        'sqlserver' {
          .\eng\ci\Invoke-ProviderIntegrationTests.ps1 -Provider SqlServer -Framework net6.0 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'SQL Server net6.0 provider lane failed.' }
          .\eng\ci\Invoke-ProviderIntegrationTests.ps1 -Provider SqlServer -Framework net8.0 -Configuration Release
        }
        'release' {
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Release lane source diff check failed.' }
          .\eng\ci\Invoke-ReleaseCandidateValidation.ps1 -Configuration Release -ResultsRoot artifacts/release-candidate
          if ($LASTEXITCODE -ne 0) { throw 'Protected release candidate validation failed.' }
        }
        default { throw "Unsupported PROVIDER_TEST_LANE '$lane'." }
      }
      if ($LASTEXITCODE -ne 0) { throw "Provider test lane '$lane' failed." }
artifacts:
  - path: '**\*.nupkg'
  - path: '**\TestResults\*.trx'
  - path: '**\TestResults\**\coverage.cobertura.xml'
  - path: '**\PublicAPI.*.txt'
  - path: 'BenchmarkDotNet.Artifacts\ci\**'
  - path: 'BenchmarkDotNet.Artifacts\ci-e2e\**'
  - path: 'artifacts\provider-test-results\**'
  - path: 'artifacts\release-candidate\**'
  - path: 'artifacts\benchmarks\release-candidate\**'
  - path: 'artifacts\test-results\release-candidate\**'
nuget:
  disable_publish_on_pr: true
