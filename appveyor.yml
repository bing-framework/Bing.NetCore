version: 1.0.0.{build}
image:
  - Visual Studio 2017
pull_requests:
  do_not_increment_build_number: true
branches:
  only:
    - master
skip_branch_with_pr: true
configuration: Release
#before_build:
#  - cmd: dotnet restore
build:
  verbosity: minimal
  parallel: true
build_script:
  - cmd: dotnet build -c Release
test_script:
  # 常规 CI 只运行无需凭据的单元测试和 SQLite 集成测试。
  # 外部 Provider 测试由受保护的专用构建注入连接字符串和 RUN_*_INTEGRATION_TESTS=true。
  - cmd: set RUN_INTEGRATION_TESTS=false&& set RUN_MYSQL_INTEGRATION_TESTS=false&& set RUN_POSTGRESQL_INTEGRATION_TESTS=false&& set RUN_SQLSERVER_INTEGRATION_TESTS=false&& set RUN_ORACLE_INTEGRATION_TESTS=false&& dotnet test -c Release
artifacts:
  - path: '**\*.nupkg'
nuget:
  disable_publish_on_pr: true
#deploy:
#  provider: NuGet
#  api_key:
#    secure: <Your secret>
