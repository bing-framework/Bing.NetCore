<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文件管理 · Bing</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/files/console.css"></head>
<body>
<header><p class="eyebrow">BING / FILES</p><h1>文件管理</h1><p class="muted">上传、业务附件与存储任务，集中管理。</p></header>
<section aria-label="访问身份" class="identity"><label for="token">访问令牌</label><input id="token" type="password" autocomplete="off" placeholder="输入当前账号的 Bearer 令牌"><button id="connect" class="primary">连接</button><span id="identity" role="status">尚未连接</span><p class="muted">令牌仅在当前页面使用。刷新后请重新输入。</p></section>
<nav aria-label="管理区域"><a href="#upload-title">上传</a><a href="#list-title">文件</a><a href="#admin-panel" class="admin-only" hidden>任务与历史</a></nav>
<div id="notice" role="status" aria-live="polite"></div>
<section aria-labelledby="upload-title"><h2 id="upload-title">上传与续传</h2><div class="grid"><div><label for="container">容器</label><select id="container"><option value="attachments">attachments</option></select><label for="storage-target">上传目标</label><select id="storage-target"><option value="">使用默认偏好</option></select><button id="save-storage-preference">设为我的默认目标</button><div id="scope-default-panel" class="connection-manager-only" hidden><label for="scope-default-target">范围默认存储目标</label><select id="scope-default-target"></select><button id="save-scope-default">设置范围默认目标</button></div><label for="file">文件</label><input id="file" type="file"></div><div><label for="sessions">我的上传任务</label><select id="sessions"><option value="">新上传</option></select><div><button id="discover">找回任务</button><button id="more-sessions" disabled>更多任务</button><button id="new-upload">新建上传</button></div></div></div>
<div><button id="start" class="primary">开始 / 恢复</button><button id="pause" disabled>暂停</button><button id="refresh">查询会话</button><button id="abort">中止会话</button></div><progress id="progress" max="100" value="0" aria-label="上传进度"></progress><p id="status" role="status" aria-live="polite">刷新或重启后，重新选择原文件即可续传。</p></section>
<section id="connections-panel"><h2>网盘连接</h2><label for="drive-template">网盘</label><select id="drive-template"></select><label for="drive-name">连接名称</label><input id="drive-name" maxlength="100"><label for="drive-ownership">归属</label><select id="drive-ownership"><option value="1">我的个人连接</option><option value="0" class="connection-manager-only" hidden>公共连接</option></select><button id="authorize-drive">授权连接</button><button id="refresh-drives">刷新连接</button><div id="drive-authorization" role="status"></div><div id="drive-connections"></div></section>
<section id="drive-management-panel" class="connection-manager-only" hidden><h2>存储连接管理</h2><button id="refresh-managed-drives">刷新范围内连接</button><div id="managed-drive-connections"></div></section>
<section><h2>待发布副本</h2><button id="refresh-copies">恢复复制请求</button><div id="binding-copies"></div></section>
<section aria-labelledby="list-title"><h2 id="list-title">文件</h2><label for="search-name">文件名</label><input id="search-name" type="search"><label class="inline admin-only" hidden><input type="checkbox" id="manage-files">管理范围内的文件</label><button id="list">查询首页</button><button id="next-page" disabled>下一页</button><div class="table-wrap"><table><thead><tr><th>文件</th><th>大小</th><th>操作</th></tr></thead><tbody id="files"></tbody></table></div>
<div id="bindings-panel" hidden><h3 id="binding-title">业务关联</h3><label for="business-type">业务类型</label><input id="business-type" value="user-info"><label for="business-id">业务标识（用户资料填写用户 GUID）</label><input id="business-id"><button id="bind">添加关联</button><button id="bindings-refresh">刷新关联</button><div id="bindings"></div></div></section>
<div id="admin-panel" class="admin-only" hidden>
<section><label for="reason">管理操作原因（重试、重放、归档和恢复必填）</label><input id="reason" maxlength="500" placeholder="填写工单或处理原因"></section>
<section><h2>后台任务</h2><label for="operation-state">状态</label><select id="operation-state"><option value="">全部</option><option value="0">等待</option><option value="1">执行中</option><option value="2">成功</option><option value="3">失败</option></select><button id="operations-load">查询首页</button><button id="operations-more" disabled>下一页</button><div id="operations" class="table-wrap"></div></section>
<section><h2>批量迁移</h2><div class="grid"><div><label for="source-store">源存储</label><input id="source-store" placeholder="local-v1"></div><div><label for="target-store">目标存储</label><input id="target-store" placeholder="minio-v1"></div></div><button id="migration-preview">预览候选</button><button id="migration-create" disabled>创建迁移批次</button><p class="muted">预览显示最多 100 条，批次将持续发现所有符合条件的文件。</p><pre id="migration-preview-result"></pre><button id="batches-load">查询批次</button><button id="batches-more" disabled>下一页</button><div id="batches" class="table-wrap"></div></section>
<section><h2>生命周期事件</h2><label class="inline"><input type="checkbox" id="failed-events">仅失败事件</label><button id="events-load">查询首页</button><button id="events-more" disabled>下一页</button><div id="events" class="table-wrap"></div><div id="event-detail"></div></section>
<section><h2>历史归档</h2><p class="muted">将已完成的记录移出默认列表，原始文件、审计和幂等记录保留，可随时恢复。</p><label for="history-kind">记录类型</label><select id="history-kind"><option value="0">成功任务</option><option value="1">已投递事件</option><option value="2">已完成迁移批次</option></select><label for="retention-days">保留天数</label><input id="retention-days" type="number" min="7" value="90"><button id="history-preview">预览（最多 20 条）</button><button id="history-archive" disabled>归档预览记录</button><pre id="history-preview-result"></pre><button id="history-load">查看归档</button><button id="history-more" disabled>下一页</button><div id="history" class="table-wrap"></div></section>
<section><h2>管理审计</h2><button id="audit-load">查询首页</button><button id="audit-more" disabled>下一页</button><div id="audit" class="table-wrap"></div></section>
</div><footer>每次管理操作均由服务端校验权限与当前版本。</footer><script type="module" src="/files/console.js"></script></body></html>
