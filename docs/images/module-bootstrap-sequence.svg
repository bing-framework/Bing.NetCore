<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500">
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="30" fill="#26215C" font-size="15" font-weight="500" font-family="Microsoft YaHei, sans-serif">模块启动序列（AddBing → AddModule → UseBing）</text>

  <rect x="220" y="44" width="240" height="44" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="64" fill="#0C447C" font-size="13" font-weight="500" font-family="Microsoft YaHei, sans-serif" text-anchor="middle">services.AddBing()</text>
  <text x="340" y="80" fill="#185FA5" font-size="11" font-family="Microsoft YaHei, sans-serif" text-anchor="middle">注册 BingCoreModule + DependencyModule (Core)</text>

  <rect x="220" y="116" width="240" height="44" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="136" fill="#3C3489" font-size="13" font-weight="500" font-family="Microsoft YaHei, sans-serif" text-anchor="middle">.AddModule&lt;T&gt;()</text>
  <text x="340" y="152" fill="#534AB7" font-size="11" font-family="Microsoft YaHei, sans-serif" text-anchor="middle">递归拉取 [DependsOnModule] 依赖</text>

  <rect x="220" y="188" width="240" height="44" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="208" fill="#633806" font-size="13" font-weight="500" font-family="Microsoft YaHei, sans-serif" text-anchor="middle">排序</text>
  <text x="340" y="224" fill="#854F0B" font-size="11" font-family="Microsoft YaHei, sans-serif" text-anchor="middle">Level → Order → FullName（非拓扑）</text>

  <rect x="200" y="260" width="280" height="44" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="280" fill="#085041" font-size="13" font-weight="500" font-family="Microsoft YaHei, sans-serif" text-anchor="middle">阶段1 · AddServices</text>
  <text x="340" y="296" fill="#0F6E56" font-size="11" font-family="Microsoft YaHei, sans-serif" text-anchor="middle">host 构建前，各模块注册 DI</text>

  <rect x="220" y="332" width="240" height="44" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="359" fill="#2C2C2A" font-size="13" font-weight="500" font-family="Microsoft YaHei, sans-serif" text-anchor="middle">BuildHost / ServiceProvider</text>

  <rect x="240" y="404" width="200" height="44" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="340" y="424" fill="#27500A" font-size="13" font-weight="500" font-family="Microsoft YaHei, sans-serif" text-anchor="middle">app.UseBing()</text>
  <text x="340" y="440" fill="#3B6D11" font-size="11" font-family="Microsoft YaHei, sans-serif" text-anchor="middle">或非 Web：serviceProvider.UseBing()</text>

  <path d="M340 88 L340 116" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrowB)"/>
  <path d="M340 160 L340 188" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrowB)"/>
  <path d="M340 232 L340 260" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrowB)"/>
  <path d="M340 304 L340 332" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrowB)"/>
  <path d="M340 376 L340 404" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrowB)"/>

  <text x="40" y="478" fill="#5F5E5A" font-size="11" font-family="Microsoft YaHei, sans-serif">阶段2 · UseModule：UseBing 按同样排序遍历模块调用 UseModule（Web 模块走 UseModule(IApplicationBuilder) 注册中间件）。</text>
</svg>
