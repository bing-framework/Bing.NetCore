name: docfx
on:
  push:
    branches:
      - "main"
      - "master"
      - "dev"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in progress and the latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: "publish docs"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Check out the branch that triggered this workflow to the 'source' subdirectory
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.400
      - name: Install required shared runtimes
        shell: bash
        run: |
          set -euo pipefail
          dotnet_path="$(readlink -f "$(command -v dotnet)")"
          dotnet_root="$(dirname "$dotnet_path")"
          echo "DOTNET_ROOT=$dotnet_root" >> "$GITHUB_ENV"
          installer="${RUNNER_TEMP}/dotnet-install.sh"
          curl --fail --silent --show-error --location https://dot.net/v1/dotnet-install.sh --output "$installer"
          for channel in 6.0 8.0; do
            bash "$installer" --runtime dotnet --channel "$channel" --install-dir "$dotnet_root" --skip-non-versioned-files --no-path
            bash "$installer" --runtime aspnetcore --channel "$channel" --install-dir "$dotnet_root" --skip-non-versioned-files --no-path
          done
      - name: Verify .NET toolchain
        shell: bash
        run: |
          set -euo pipefail
          dotnet_path="$(readlink -f "$(command -v dotnet)")"
          dotnet_root="$(dirname "$dotnet_path")"
          test "$(realpath "$DOTNET_ROOT")" = "$(realpath "$dotnet_root")"
          case ":$PATH:" in
            *":$DOTNET_ROOT:"*) ;;
            *) echo "DOTNET_ROOT is not visible on PATH" >&2; exit 1 ;;
          esac
          test "$(dotnet --version)" = "10.0.400"
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          sdks="$(dotnet --list-sdks)"
          printf '%s\n' "$sdks"
          printf '%s\n' "$sdks" | grep -F '10.0.400 [' | grep -F "[$DOTNET_ROOT/sdk]"
          runtimes="$(dotnet --list-runtimes)"
          printf '%s\n' "$runtimes"
          for runtime in 'Microsoft.NETCore.App 6.0.' 'Microsoft.NETCore.App 8.0.' 'Microsoft.AspNetCore.App 6.0.' 'Microsoft.AspNetCore.App 8.0.'; do
            family="${runtime% *}"
            printf '%s\n' "$runtimes" | grep -F "$runtime" | grep -F "[$DOTNET_ROOT/shared/$family]"
          done
      - name: install dotnet tools
        run: |
          dotnet tool install -g dotnet-execute
          dotnet tool install -g docfx
      # Run a build
      - name: Build docs
        run: |
          dotnet-exec info
          dotnet build Bing.All.slnx
          docfx ./docs/docfx.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
