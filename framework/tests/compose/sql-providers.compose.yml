services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bing_integration_test
      MYSQL_USER: bing
      MYSQL_PASSWORD: bing_local_test_password
      MYSQL_ROOT_PASSWORD: bing_local_root_password
    ports:
      - "33076:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pbing_local_root_password"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgresql:
    image: postgres:16
    environment:
      POSTGRES_DB: bing_integration_test
      POSTGRES_USER: bing
      POSTGRES_PASSWORD: bing_local_test_password
    ports:
      - "35432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bing -d bing_integration_test"]
      interval: 5s
      timeout: 3s
      retries: 30

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: BingLocalTestPassword1!
    ports:
      - "31433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'BingLocalTestPassword1!' -Q 'Select 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30