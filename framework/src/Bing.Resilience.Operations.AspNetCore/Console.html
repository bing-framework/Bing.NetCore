<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>持久操作控制台</title>
<style nonce="{{nonce}}">
:root{font-family:system-ui,sans-serif;color:#183044;background:#f4f7fa}body{max-width:960px;margin:40px auto;padding:0 24px}h1{font-size:28px}section{background:white;padding:24px;border:1px solid #d5e0e8;border-radius:8px;margin:20px 0}label{display:block;margin:12px 0 6px}input,select,textarea,button{font:inherit;padding:10px;box-sizing:border-box}input,select,textarea{width:100%;border:1px solid #a4b6c4;border-radius:4px}button{background:#164e63;color:white;border:0;border-radius:4px;margin-top:14px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fa;padding:16px}#status{min-height:24px}small{color:#526b7d}.row{display:grid;grid-template-columns:1fr 2fr;gap:16px}@media(max-width:600px){.row{display:block}body{margin:20px auto}}
</style></head>
<body data-replay="{{replay}}" data-saga="{{saga}}" data-session="{{session}}">
<h1>持久操作控制台</h1><p>按操作 ID 查询状态。人工操作需要当前版本和操作原因，权限由宿主账户决定。</p>
<section><h2>查询</h2><div class="row"><div><label for="kind">操作类型</label><select id="kind"><option value="replay">Replay</option><option value="saga">Saga</option></select></div><div><label for="id">操作 ID</label><input id="id" maxlength="64" autocomplete="off"></div></div><button id="load">读取状态</button><pre id="result" aria-label="查询结果">尚未查询</pre></section>
<section><h2>人工操作</h2><label for="version">预期版本</label><input id="version" type="number" min="0" step="1"><label for="step">Saga 步骤 ID</label><input id="step" maxlength="128" autocomplete="off"><small>填写流程定义中的步骤 ID；Replay 无需填写。</small><label for="action">动作</label><select id="action"><option value="cancel">取消 Replay</option><option value="0">重试 Saga 步骤</option><option value="1">跳过 Saga 步骤</option><option value="2">确认步骤已成功</option><option value="3">确认步骤无副作用</option><option value="4">补偿 Saga 步骤</option></select><label for="reason">操作原因</label><textarea id="reason" rows="3" maxlength="512"></textarea><button id="apply">确认并执行</button></section>
<p id="status" role="status" aria-live="polite"></p>
<script nonce="{{nonce}}">
(()=>{'use strict';const $=id=>document.getElementById(id);let loaded=null;const data=document.body.dataset;
const status=message=>{$('status').textContent=message;};
const current=()=>({kind:$('kind').value,id:$('id').value.trim()});
const url=selection=>data[selection.kind]+'/'+encodeURIComponent(selection.id);
async function request(target,options){const response=await fetch(target,{credentials:'same-origin',...options});if(!response.ok){const messages={400:'请求无效或防伪凭据失效，请重新查询。',401:'请先在宿主应用登录。',403:'当前账户没有此操作权限。',404:'未找到操作或无权访问。',409:'操作版本已改变，请重新查询。',422:'当前状态不允许此动作。'};throw new Error(messages[response.status]||'请求失败：'+response.status);}return response.status===204?null:response.json();}
async function load(){const selection=current();if(!selection.id)throw new Error('请输入操作 ID。');loaded=null;const result=await request(url(selection));loaded=selection;$('result').textContent=JSON.stringify(result,null,2);$('version').value=String(selection.kind==='saga'?result.saga.version:result.version);status('状态已更新。');}
async function apply(){const selection=current();if(!loaded||loaded.kind!==selection.kind||loaded.id!==selection.id)throw new Error('请先读取当前操作的状态。');const version=Number($('version').value),reason=$('reason').value.trim(),action=$('action').value;if($('version').value===''||!Number.isSafeInteger(version)||version<0||!reason)throw new Error('请填写有效版本和原因。');const isReplay=selection.kind==='replay';if(isReplay!==(action==='cancel'))throw new Error('动作与操作类型不一致。');const step=$('step').value.trim();if(!isReplay&&!step)throw new Error('请输入 Saga 步骤 ID。');const session=await request(data.session);await request(url(selection)+(isReplay?'/cancel':'/steps/'+encodeURIComponent(step)+'/manual'),{method:'POST',headers:{'Content-Type':'application/json',[session.headerName]:session.token},body:JSON.stringify(isReplay?{expectedVersion:version,reason}:{expectedSagaVersion:version,action:Number(action),reason})});await load();status('人工操作已完成，状态已刷新。');}
for(const [id,handler] of [['load',load],['apply',apply]])$(id).addEventListener('click',async()=>{$(id).disabled=true;try{await handler();}catch(error){status(error.message);}finally{$(id).disabled=false;}});
})();
</script></body></html>
